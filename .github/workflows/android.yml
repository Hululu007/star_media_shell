name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Scaffold Android
        run: |
          set -euo pipefail
          if [ -d android ]; then
            mv android android_custom
          fi
          flutter create . --platforms=android --project-name star_media_shell
          test -d android/app

      - name: Merge custom native code
        run: |
          set -euo pipefail
          CUSTOM=android_custom
          if [ ! -d "$CUSTOM" ]; then
            echo "no android_custom, skip merge"
            exit 0
          fi

          mkdir -p android/app/src/main/kotlin/com/starmedia/shell
          if [ -d "$CUSTOM/app/src/main/kotlin" ]; then
            cp -a "$CUSTOM/app/src/main/kotlin/." android/app/src/main/kotlin/
          fi

          if [ -f "$CUSTOM/app/src/main/AndroidManifest.xml" ]; then
            cp "$CUSTOM/app/src/main/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          fi

          if [ -d "$CUSTOM/app/src/main/res" ]; then
            cp -a "$CUSTOM/app/src/main/res/." android/app/src/main/res/ || true
          fi

          # Prefer NOT enabling Chaquopy on CI first (heavy + flaky); keep Kotlin reflection fallback
          # Users can enable locally via android/CHAQUOPY.md

          # Force SDK 36 on Groovy or KTS app build files
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle || true
            sed -i 's/compileSdkVersion .*/compileSdk 36/' android/app/build.gradle || true
            sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = Math.max(flutter.minSdkVersion, 24)/' android/app/build.gradle || true
            sed -i 's/namespace = .*/namespace = "com.starmedia.shell"/' android/app/build.gradle || true
            sed -i 's/applicationId = .*/applicationId = "com.starmedia.shell"/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
            sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle.kts || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 24)/' android/app/build.gradle.kts || true
            sed -i 's/namespace = .*/namespace = "com.starmedia.shell"/' android/app/build.gradle.kts || true
            sed -i 's/applicationId = .*/applicationId = "com.starmedia.shell"/' android/app/build.gradle.kts || true
          fi

          mkdir -p assets/images assets/icons assets/js assets/media assets/python
          # Help plugins using compilerOptions DSL
          if [ -f android/settings.gradle ]; then
            # ensure recent kotlin if specified
            true
          fi
          if [ -f android/gradle.properties ]; then
            grep -q kotlin.jvm.target.validation.mode android/gradle.properties || echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          fi
          echo MERGE_OK
          ls android/app/src/main/kotlin/com/starmedia/shell/ || true
          echo "--- app build file head ---"
          head -40 android/app/build.gradle 2>/dev/null || head -40 android/app/build.gradle.kts 2>/dev/null || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: star-media-shell-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
