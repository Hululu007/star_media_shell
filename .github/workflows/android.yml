name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Backup custom native sources
        run: |
          mkdir -p /tmp/sms_backup
          cp -a android /tmp/sms_backup/android || true
          ls -la /tmp/sms_backup/android/app/src/main/kotlin/com/starmedia/shell/ || true

      - name: Generate Android scaffolding
        run: |
          # 已有工程不要再传 --project-name / --org（会直接失败）
          flutter create . --platforms=android
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Restore Kotlin + merge Chaquopy
        run: |
          set -e
          # 恢复 Kotlin 源码
          mkdir -p android/app/src/main/kotlin/com/starmedia/shell
          cp -a /tmp/sms_backup/android/app/src/main/kotlin/com/starmedia/shell/. \
            android/app/src/main/kotlin/com/starmedia/shell/ || true

          # 恢复我们维护的 Manifest / CHAQUOPY 文档等
          if [ -f /tmp/sms_backup/android/app/src/main/AndroidManifest.xml ]; then
            cp /tmp/sms_backup/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          # 资源
          if [ -d /tmp/sms_backup/android/app/src/main/res ]; then
            cp -a /tmp/sms_backup/android/app/src/main/res/. android/app/src/main/res/ || true
          fi

          # —— 合并 settings.gradle：声明 Chaquopy 插件 ——
          if [ -f android/settings.gradle ]; then
            if ! grep -q 'com.chaquo.python' android/settings.gradle; then
              # Groovy settings
              if grep -q 'plugins {' android/settings.gradle; then
                sed -i '/plugins {/a\    id "com.chaquo.python" version "17.2.0" apply false' android/settings.gradle
              fi
            fi
          fi
          if [ -f android/settings.gradle.kts ]; then
            if ! grep -q 'com.chaquo.python' android/settings.gradle.kts; then
              sed -i '/plugins {/a\    id("com.chaquo.python") version "17.2.0" apply false' android/settings.gradle.kts
            fi
          fi

          # —— 合并 app/build.gradle ——
          APP_G=android/app/build.gradle
          APP_K=android/app/build.gradle.kts
          if [ -f "$APP_G" ]; then
            if ! grep -q 'com.chaquo.python' "$APP_G"; then
              sed -i '/^plugins {/a\    id "com.chaquo.python"' "$APP_G"
            fi
            if ! grep -q 'python {' "$APP_G"; then
              # 在 defaultConfig 块内注入（简单追加到 android 闭包前不稳，用文件尾依赖外注入脚本）
              python3 << 'PY'
from pathlib import Path
p = Path("android/app/build.gradle")
t = p.read_text()
if "python {" not in t:
    inject = '''
    // Chaquopy
    defaultConfig {
        // patched below if duplicate — see merge
    }
'''
    # inject ndk + python into existing defaultConfig
    if "defaultConfig {" in t and "abiFilters" not in t:
        t = t.replace(
            "defaultConfig {",
            '''defaultConfig {
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
        python {
            version "3.11"
            pip {
                install "requests"
                install "urllib3"
                install "certifi"
                install "charset-normalizer"
                install "idna"
                install "beautifulsoup4"
                install "lxml"
                install "pycryptodome"
            }
        }''',
            1,
        )
    if "minSdk" in t and "Math.max" not in t:
        import re
        t = re.sub(r"minSdk\s*=\s*[^\n]+", "minSdk = Math.max(flutter.minSdkVersion, 24)", t, count=1)
        t = re.sub(r"minSdkVersion\s+[^\n]+", "minSdkVersion Math.max(flutter.minSdkVersion, 24)", t, count=1)
    p.write_text(t)
    print("app/build.gradle patched")
PY
            fi
          fi

          if [ -f "$APP_K" ]; then
            if ! grep -q 'com.chaquo.python' "$APP_K"; then
              sed -i '/^plugins {/a\    id("com.chaquo.python")' "$APP_K"
            fi
          fi

          # Application name
          MAN=android/app/src/main/AndroidManifest.xml
          if [ -f "$MAN" ]; then
            if ! grep -q 'StarApplication' "$MAN"; then
              sed -i 's/<application/<application android:name=".StarApplication"/' "$MAN" || true
            fi
          fi

          mkdir -p assets/images assets/icons assets/js assets/media assets/python
          echo "merge done"
          ls android/app/src/main/kotlin/com/starmedia/shell/
          grep -n 'chaquo\|python\|StarApplication' android/settings.gradle android/app/build.gradle android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: star-media-shell-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
