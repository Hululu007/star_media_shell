name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Scaffold Android (move custom aside first)
        run: |
          set -euo pipefail
          # 关键失败点：不完整的 android/ 会让 flutter create 直接退出
          if [ -d android ]; then
            mv android android_custom
          fi
          flutter create . --platforms=android --project-name star_media_shell
          test -d android/app

      - name: Merge custom Kotlin / Manifest / Chaquopy
        run: |
          set -euo pipefail
          CUSTOM=android_custom
          test -d "$CUSTOM" || { echo "no custom android"; exit 0; }

          # Kotlin
          mkdir -p android/app/src/main/kotlin/com/starmedia/shell
          if [ -d "$CUSTOM/app/src/main/kotlin" ]; then
            cp -a "$CUSTOM/app/src/main/kotlin/." android/app/src/main/kotlin/
          fi

          # Manifest：强制 StarApplication + 网络权限
          MAN=android/app/src/main/AndroidManifest.xml
          if [ -f "$CUSTOM/app/src/main/AndroidManifest.xml" ]; then
            cp "$CUSTOM/app/src/main/AndroidManifest.xml" "$MAN"
          fi
          # 若生成的 package 与命名空间不一致，至少保证 INTERNET
          if ! grep -q 'android.permission.INTERNET' "$MAN"; then
            sed -i 's#<manifest#<manifest>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <!-- #' "$MAN" || true
          fi

          # res extras
          if [ -d "$CUSTOM/app/src/main/res" ]; then
            cp -a "$CUSTOM/app/src/main/res/." android/app/src/main/res/ || true
          fi

          # settings.gradle 注入 Chaquopy 插件声明
          for f in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$f" ] || continue
            if ! grep -q 'com.chaquo.python' "$f"; then
              if [[ "$f" == *.kts ]]; then
                sed -i '/plugins {/a\    id("com.chaquo.python") version "17.2.0" apply false' "$f"
              else
                sed -i '/plugins {/a\    id "com.chaquo.python" version "17.2.0" apply false' "$f"
              fi
            fi
          done

          # app build.gradle 注入插件与 python 块
          python3 << 'PY'
from pathlib import Path
import re

for name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
    p = Path(name)
    if not p.exists():
        continue
    t = p.read_text()
    is_kts = name.endswith(".kts")
    if "com.chaquo.python" not in t:
        if is_kts:
            t = t.replace("plugins {", 'plugins {\n    id("com.chaquo.python")', 1)
        else:
            t = t.replace("plugins {", 'plugins {\n    id "com.chaquo.python"', 1)

    if "python {" not in t and "defaultConfig" in t:
        block = '''
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
        python {
            version "3.11"
            pip {
                install "requests"
                install "urllib3"
                install "certifi"
                install "charset-normalizer"
                install "idna"
                install "beautifulsoup4"
                install "lxml"
                install "pycryptodome"
            }
        }
'''
        if is_kts:
            block = '''
        ndk {
            abiFilters += listOf("armeabi-v7a", "arm64-v8a", "x86_64")
        }
'''
            # kts python DSL may differ; skip pip on kts to avoid syntax issues
        t = t.replace("defaultConfig {", "defaultConfig {" + block, 1)

    # minSdk 24+
    t2 = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = Math.max(flutter.minSdkVersion, 24)", t)
    t2 = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion Math.max(flutter.minSdkVersion, 24)", t2)
    t = t2

    # applicationId / namespace 对齐
    if "com.starmedia.shell" not in t and "namespace" in t:
        t = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.starmedia.shell"', t)
        t = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.starmedia.shell"', t)

    p.write_text(t)
    print("patched", name)

# 确认 MainActivity 包名目录
print("kotlin tree:")
import os
for root, dirs, files in os.walk("android/app/src/main/kotlin"):
    for f in files:
        print(os.path.join(root, f))
PY

          mkdir -p assets/images assets/icons assets/js assets/media assets/python
          echo "MERGE_OK"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: star-media-shell-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
