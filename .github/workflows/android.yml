name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure project scaffolding
        run: |
          # 生成缺失的 android/ios 脚手架，但尽量不覆盖我们已有的定制文件
          mkdir -p /tmp/android_backup
          cp -a android /tmp/android_backup/ 2>/dev/null || true
          flutter create . --project-name star_media_shell --org com.starmedia --platforms=android
          # 恢复定制 Android 文件
          cp -a /tmp/android_backup/android/. android/ 2>/dev/null || true
          # 保证关键 目录存在（assets 引用）
          mkdir -p assets/images assets/icons assets/js assets/media assets/python

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify Chaquopy config
        run: |
          grep -n 'com.chaquo.python' android/settings.gradle android/app/build.gradle || echo "WARN: chaquopy markers missing"
          grep -n 'StarApplication' android/app/src/main/AndroidManifest.xml || true

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: star-media-shell-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
